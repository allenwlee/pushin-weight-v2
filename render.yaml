# Render Blueprint — pushinweight.ai
# https://render.com/docs/blueprint-spec

services:
  # --------------------------------------------------------------------------
  # Django web service
  # --------------------------------------------------------------------------
  - type: web
    name: pushinweight-web
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn project.wsgi:application --log-file -
    healthCheckPath: /accounts/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1,.onrender.com,pushinweight.ai,www.pushinweight.ai
      - key: CSRF_TRUSTED_ORIGINS
        value: https://pushinweight.ai,https://www.pushinweight.ai
      - key: X_MONITOR_LIST_ID
        value: "2067062923525275922"
      - key: DATABASE_URL
        fromDatabase:
          name: pushinweight-db-shadow
          property: connectionString
      - fromGroup: pushinweight-secrets

cronJobs:
  # --------------------------------------------------------------------------
  # Harvest cron — runs every 15 minutes (mirrors v1 launchd cadence)
  # --------------------------------------------------------------------------
  - name: pushinweight-harvest
    runtime: python
    plan: starter
    schedule: "*/15 * * * *"
    buildCommand: ./build.sh
    startCommand: python manage.py run_cycle --limit-per-call 50
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1,.onrender.com
      - key: X_MONITOR_LIST_ID
        value: "2067062923525275922"
      - key: DATABASE_URL
        fromDatabase:
          name: pushinweight-db-shadow
          property: connectionString
      - fromGroup: pushinweight-secrets

databases:
  # --------------------------------------------------------------------------
  # Managed PostgreSQL
  # --------------------------------------------------------------------------
  - name: pushinweight-db
    plan: free
    databaseName: pushinweight
    user: pushinweight
