# Render Blueprint — x-monitor v2
# https://render.com/docs/blueprint-spec

services:
  # --------------------------------------------------------------------------
  # Django web service
  # --------------------------------------------------------------------------
  - type: web
    name: xmonitor-web
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn project.wsgi:application --log-file -
    healthCheckPath: /accounts/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1,.onrender.com,pushinweight.ai,www.pushinweight.ai
      - key: CSRF_TRUSTED_ORIGINS
        value: https://pushinweight.ai,https://www.pushinweight.ai
      - key: DATABASE_URL
        fromDatabase:
          name: xmonitor-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromDatabase:
          name: xmonitor-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromDatabase:
          name: xmonitor-redis
          property: connectionString
      - fromGroup: pushinweight-secrets

  # --------------------------------------------------------------------------
  # Celery worker (harvest cycles)
  # --------------------------------------------------------------------------
  - type: worker
    name: xmonitor-worker
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: celery -A project worker -l INFO --concurrency=1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: xmonitor-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromDatabase:
          name: xmonitor-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromDatabase:
          name: xmonitor-redis
          property: connectionString
      - fromGroup: pushinweight-secrets

  # --------------------------------------------------------------------------
  # Celery Beat scheduler
  # --------------------------------------------------------------------------
  - type: worker
    name: xmonitor-beat
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: celery -A project beat -l INFO
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: xmonitor-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromDatabase:
          name: xmonitor-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromDatabase:
          name: xmonitor-redis
          property: connectionString
      - fromGroup: pushinweight-secrets

databases:
  # --------------------------------------------------------------------------
  # Managed PostgreSQL
  # --------------------------------------------------------------------------
  - name: xmonitor-db
    plan: free
    databaseName: xmonitor
    user: xmonitor

  # --------------------------------------------------------------------------
  # Managed Redis (for Celery)
  # --------------------------------------------------------------------------
  - name: xmonitor-redis
    plan: free
    ipAllowList: []
