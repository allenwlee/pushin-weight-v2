# Render Blueprint — pushinweight.ai
# https://render.com/docs/blueprint-spec

services:
  # --------------------------------------------------------------------------
  # Dedicated broker for the headline-only queue. This does not schedule work.
  # --------------------------------------------------------------------------
  - type: keyvalue
    name: pushinweight-headlines-broker
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  # --------------------------------------------------------------------------
  # Django web service
  # --------------------------------------------------------------------------
  - type: web
    name: pushinweight-web
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn project.wsgi:application --log-file -
    healthCheckPath: /accounts/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: X_MONITOR_DEPLOYMENT_ENVIRONMENT
        value: production
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1,.onrender.com,pushinweight.ai,www.pushinweight.ai
      - key: CSRF_TRUSTED_ORIGINS
        value: https://pushinweight.ai,https://www.pushinweight.ai
      - key: X_MONITOR_LIST_ID
        value: "2067062923525275922"
      - key: DATABASE_URL
        fromDatabase:
          name: pushinweight-db-shadow
          property: connectionString
      - key: X_MONITOR_HEADLINE_SERVING_ENABLED
        value: "True"
      - key: X_MONITOR_HEADLINE_ACTIVATION_STATE
        value: owner_override
      - key: X_MONITOR_HEADLINE_PUBLICATION_SOURCE
        value: prefer_per_brand
      - key: X_MONITOR_HEADLINE_CONTROL_REVISION
        value: v24-integrated-ja-demand-20260911
      - key: X_MONITOR_HEADLINE_DEMAND_SHAPING_ENABLED
        value: "True"
      - key: X_MONITOR_HEADLINE_CRITIC_RISK_ROUTING_ENABLED
        value: "True"
      - key: X_MONITOR_SYNTHESIS_CONTROL_REVISION
        value: v2-demand-ja-output1024-20260921
      # Render-managed group must supply purpose-separated TwitterAPI keys:
      # TWITTERAPI_IO_SCHEDULED_API_KEY and TWITTERAPI_IO_ON_DEMAND_API_KEY.
      - fromGroup: pushinweight-secrets

  # Public official-careers pull. Kept separate from run_cycle so an ATS
  # outage cannot affect Twitter cursors, credit accounting, or enrichment.
  - type: cron
    name: pushinweight-jobs
    runtime: python
    plan: starter
    schedule: "17 */6 * * *"
    buildCommand: ./build.sh
    startCommand: python manage.py sync_job_sources
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: X_MONITOR_DEPLOYMENT_ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pushinweight-db-shadow
          property: connectionString

  # --------------------------------------------------------------------------
  # Queue-isolated trend-narrative worker. Render cron remains the scheduler.
  # --------------------------------------------------------------------------
  - type: worker
    name: pushinweight-headlines
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: >-
      celery -A project worker -l INFO -Q trend-narratives --concurrency=1
      --prefetch-multiplier=1 --without-gossip --without-mingle
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: pushinweight-db-shadow
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: pushinweight-headlines-broker
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: pushinweight-headlines-broker
          property: connectionString
      # Headline generation still uses DeepSeek directly; translation and
      # classification use the separate DeepInfra credential on harvest.
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: X_MONITOR_HEADLINE_PROVIDER_CALLS_ENABLED
        value: "True"
      - key: X_MONITOR_HEADLINE_ACTIVATION_STATE
        value: owner_override
      - key: X_MONITOR_HEADLINE_CONTROL_REVISION
        value: v24-integrated-ja-demand-20260911
      - key: X_MONITOR_HEADLINE_DEMAND_SHAPING_ENABLED
        value: "True"
      - key: X_MONITOR_HEADLINE_CRITIC_RISK_ROUTING_ENABLED
        value: "True"

  # --------------------------------------------------------------------------
  # PostgreSQL-only rich-synthesis worker. It has no scheduler, Twitter key,
  # Celery broker, or headline queue access.
  # --------------------------------------------------------------------------
  - type: worker
    name: pushinweight-synthesis
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: python manage.py run_synthesis_worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: X_MONITOR_DEPLOYMENT_ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pushinweight-db-shadow
          property: connectionString
      - key: DEEPINFRA_API_KEY
        sync: false
      - key: X_MONITOR_SYNTHESIS_PROVIDER_CALLS_ENABLED
        value: "True"
      - key: X_MONITOR_SYNTHESIS_ACTIVATION_STATE
        value: owner_override
      - key: X_MONITOR_SYNTHESIS_CONTROL_REVISION
        value: v2-demand-ja-output1024-20260921

  # --------------------------------------------------------------------------
  # Harvest cron — runs every 15 minutes (mirrors v1 launchd cadence)
  # --------------------------------------------------------------------------
  - type: cron
    name: pushinweight-harvest
    runtime: python
    plan: starter
    schedule: "*/15 * * * *"
    buildCommand: ./build.sh
    startCommand: python manage.py run_cycle --scheduled
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: X_MONITOR_DEPLOYMENT_ENVIRONMENT
        value: production
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1,.onrender.com
      - key: X_MONITOR_LIST_ID
        value: "2067062923525275922"
      - key: DATABASE_URL
        fromDatabase:
          name: pushinweight-db-shadow
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: pushinweight-headlines-broker
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: pushinweight-headlines-broker
          property: connectionString
      - key: X_MONITOR_HEADLINE_ENQUEUE_ENABLED
        value: "True"
      - key: X_MONITOR_HEADLINE_ACTIVATION_STATE
        value: owner_override
      - key: X_MONITOR_HEADLINE_CONTROL_REVISION
        value: v24-integrated-ja-demand-20260911
      - key: X_MONITOR_HEADLINE_DEMAND_SHAPING_ENABLED
        value: "True"
      - key: X_MONITOR_HEADLINE_CRITIC_RISK_ROUTING_ENABLED
        value: "True"
      - key: X_MONITOR_LITERAL_TRANSLATION_V2_ENABLED
        value: "True"
      # Optional discovery/extraction lanes are fail-closed until a separately
      # reviewed production activation changes these explicit controls.
      - key: X_MONITOR_DISCOVERY_JOBS_ENABLED
        value: "False"
      - key: X_MONITOR_DISCOVERY_JOBS_PER_CYCLE_CALL_CEILING
        value: "1"
      - key: X_MONITOR_DISCOVERY_JOBS_MAX_RESULTS
        value: "20"
      - key: X_MONITOR_DISCOVERY_JOBS_MAX_PAGES
        value: "1"
      - key: X_MONITOR_DISCOVERY_PERSONNEL_ENABLED
        value: "False"
      - key: X_MONITOR_DISCOVERY_PERSONNEL_PER_CYCLE_CALL_CEILING
        value: "1"
      - key: X_MONITOR_DISCOVERY_PERSONNEL_MAX_RESULTS
        value: "20"
      - key: X_MONITOR_DISCOVERY_PERSONNEL_MAX_PAGES
        value: "1"
      - key: X_MONITOR_TARGETED_EXTRACTION_ENABLED
        value: "False"
      - key: X_MONITOR_TARGETED_EXTRACTION_MAX_CALLS_PER_CYCLE
        value: "0"
      - key: X_MONITOR_SYNTHESIS_PREWARM_ENABLED
        value: "False"
      - key: X_MONITOR_SYNTHESIS_PREWARM_PER_CYCLE
        value: "0"
      - key: DEEPINFRA_API_KEY
        sync: false
      - key: TYPESAFE_API_KEY
        sync: false
      # Render-managed group must supply purpose-separated TwitterAPI keys:
      # TWITTERAPI_IO_SCHEDULED_API_KEY and TWITTERAPI_IO_ON_DEMAND_API_KEY.
      - fromGroup: pushinweight-secrets

databases:
  # Existing production authority. Naming it here matches the resource instead
  # of provisioning the never-created `pushinweight-db` candidate.
  - name: pushinweight-db-shadow
