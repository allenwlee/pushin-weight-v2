# Render Blueprint — pushinweight.ai (x-monitor v2)
# https://render.com/docs/blueprint-spec

services:
  # --------------------------------------------------------------------------
  # Django web service
  # --------------------------------------------------------------------------
  - type: web
    name: pushinweight-web
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn project.wsgi:application --log-file -
    healthCheckPath: /accounts/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1,.onrender.com,pushinweight.ai,www.pushinweight.ai
      - key: CSRF_TRUSTED_ORIGINS
        value: https://pushinweight.ai,https://www.pushinweight.ai
      - key: DATABASE_URL
        fromDatabase:
          name: pushinweight-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: pushinweight-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: pushinweight-redis
          property: connectionString
      - fromGroup: pushinweight-secrets

  # --------------------------------------------------------------------------
  # Celery worker (harvest cycles)
  # --------------------------------------------------------------------------
  - type: worker
    name: pushinweight-worker
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: celery -A project worker -l INFO --concurrency=1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: pushinweight-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: pushinweight-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: pushinweight-redis
          property: connectionString
      - fromGroup: pushinweight-secrets

  # --------------------------------------------------------------------------
  # Celery Beat scheduler
  # --------------------------------------------------------------------------
  - type: worker
    name: pushinweight-beat
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: celery -A project beat -l INFO
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: pushinweight-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: pushinweight-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: pushinweight-redis
          property: connectionString
      - fromGroup: pushinweight-secrets

  # --------------------------------------------------------------------------
  # Redis (Celery broker + result backend)
  # --------------------------------------------------------------------------
  - type: keyvalue
    name: pushinweight-redis
    plan: free
    ipAllowList: []

databases:
  # --------------------------------------------------------------------------
  # Managed PostgreSQL
  # --------------------------------------------------------------------------
  - name: pushinweight-db
    plan: free
    databaseName: pushinweight
    user: pushinweight
