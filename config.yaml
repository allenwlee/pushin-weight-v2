# {{AGENT_ATTRIBUTION}}
# x-monitor configuration. PR-reviewable; changes here trigger a re-run via
# LaunchAgent WatchPaths (only data/queries/ is watched, this file is the
# config; restart manually after editing).

# Models to monitor. Adding a model = adding model_id here + an INSERT
# into `brands_accounts` (canonical) + an INSERT into `account_handle`
# for any new handles. No code change.
#
# Plan 2026-07-11-001 retired data/queries/<brand>.yaml.
# Plan 2026-07-11-002 (U4) retired data/accounts/<brand>.yaml; the
# runtime source for per-brand official/staff handles is the
# `brands_accounts` DB table (joined to `accounts` and `roles`,
# filtered to role_id IN (2, 3)).
enabled_models:
  - minimax
  - qwen
  - deepseek
  - glm
  - mimo
  - moonshot_kimi
  - inclusionai
  - mistral
  - stepfun
  - ernie
  - hunyuan
  - llama
  - nemo_megatron
  - doubao
  - yi
  - sensechat
  - exaone
  - kuaishou
  - sakana_ai
  - upstage
# v1.7.x Call B group split. The union of all enabled_models' brand
# tokens (loaded from data/queries/<brand>.yaml Q2/Q3/Q5/Q6 first
# paren) exceeds the 512-char X advanced-search cap once we add the
# 9 new brands (Llama, NeMo, Doubao, Yi, SenseChat, EXAONE, Karakuri,
# Kuaishou, Upstage). Splitting into three semantic groups keeps each
# Call B under cap:
#   B1: top-presence / global brands (6 brands)
#   B2: Chinese-language brands (4 brands)
#   B3: specialized / smaller brands (4 brands)
# Plan 2026-07-13-002 U4: 6 polysemous brands are intentionally absent
# from B because the C1/C2 specs already cover them via co-occurrence
# AND-filter (the dedup from commit 3915675):
#   - llama, mimo, moonshot_kimi, yi → C1 (call_c_specs[0].brands)
#   - ernie, upstage                    → C2 (call_c_specs[1].brands)
# Recall for the 6 dropped brands is preserved via the C1/C2
# co-occurrence path; this change halves the duplicate TwitterAPI
# credit spend on the B path. The validator at x_monitor/config.py
# emits a warning if a future config reintroduces a dupe.
# When `call_b_groups` is absent or null, plan_calls emits one Call B
# spanning all enabled_models (legacy v1.7 behavior). Set to null to
# disable the split.
call_b_groups:
  - [minimax, qwen, deepseek, stepfun, hunyuan]
  - [doubao, glm, sensechat, inclusionai]
  - [nemo_megatron, exaone, sakana_ai, kuaishou]

# Daily TwitterAPI.io budget (pay-per-use). Each unit = 1 tweet returned by
# advanced_search. 333/day gives 6x headroom over the 9x5x50=2250 upper bound
# from SC1. At $0.15/1k tweets, a full 333/day is ~$0.05/day = ~$1.50/mo.
daily_ceiling: 333

# Reply-chain cluster threshold (Q3). Tune via PR.
clustering:
  min_commenters: 3
  min_posts: 2

# Search caps for the main-loop advanced_search call (U1, 2026-07-02).
# All three are operator-tunable without a code edit. Defaults match
# the prior hardcoded values; omit this block to use defaults.
#   max_results   tweets per logical call (default 50)
#   max_per_page  TwitterAPI.io per-page request size (default 20)
#   max_pages     pagination safety cap (default 5)
# Credit math at defaults: 100 pages × 20 tweets = 2,000 tweets per call ceiling.
# Cursor sweep keeps the steady-state per-cycle fetch well below that.
search:
  max_results: 2000
  max_per_page: 20
  max_pages: 100

# Cycle-level runtime constants (post-2026-08-01 wiring).
# All five have defaults that match the prior hardcoded values in
# monitor/cycle.py, so omitting this block preserves existing behavior.
# Plan: docs/plans/2026-08-01-001-refactor-harvester-config-wiring-plan.md
cycle:
  cursor_overlap_seconds: 60   # 1 minute overlap between windows
  max_lookback_hours: 0.25      # clamp cold-start sweep to 15min (one cycle window) -- 2026-08-06 cursor-vs-insert fix per docs/operations/cursor-vs-insert-gap-diagnosis.md
  c1_max_results: 150          # C1 override (R4 in 2026-07-30-002)
  c1_max_pages: 8              # 150 / 20 per page
  max_truncation_walks: 5      # drain retries on truncated windows

# Near-real-time harvester budgets and bounded recovery defaults.
# One 13-minute monotonic deadline leaves a two-minute reserve before the
# next 15-minute slot; all later fetch/enrichment/replay consumers share it.
harvest:
  run_deadline_seconds: 780
  next_slot_reserve_seconds: 120
  tip_sweep_target_seconds: 120
  relevancy_timeout_seconds: 30
  backlog:
    pending_per_call: 8
    quarantined_per_call: 4
    max_attempts: 8
    max_age_hours: 24
    replays_per_cycle: 2
  list_membership:
    page_size: 20
    max_pages: 100
    reconcile_interval_hours: 6
    request_timeout_seconds: 30
  enrichment:
    claim_per_cycle: 20
    max_attempts: 8
    max_age_hours: 24
    claim_ttl_seconds: 180
    attempt_budget_seconds: 90

# One-shot metrics re-fetch (plan 2026-08-10-002). Each post is by-ID
# refreshed exactly once after delay_hours from first fetched_at.
# Replaces continuous official/staff QT recheck loop.
metrics_refresh:
  enabled: true
  delay_hours: 2.0
  per_cycle_cap: 200


# LLM routing (plan 2026-08-01-002 U6). Defaults mirror the values
# the v1 + v2 stacks used prior to this change; operators can
# override per-env via X_MONITOR_<role>_MODEL without editing
# config.yaml. The translator_base_url defaults to the
# ANTHROPIC_BASE_URL env var (preserves the proxy path the v1
# shell already configures).
llm:
  translator_model: "deepseek-v4-pro"  # BEFORE 2026-08-04: minimax/MiniMax-M3.0[1m] (swapped to lift the M3 proxy-side response cap, plan 2026-08-04-001)
  translator_base_url: null    # uses ANTHROPIC_BASE_URL env when null
  classifier_model: "deepseek-v4-pro"
  relevancy_model: "claude-haiku-4-5"
  signal_model: "claude-haiku-4-5"

# Shared V22 trend-narrative generation. This role never inherits the
# translator/classifier route. The three rollout controls remain fail-closed
# unless their service-specific environment variables explicitly enable them.
headline_narrative:
  provider: "deepseek"
  base_url: "https://api.deepseek.com/anthropic"
  model: "deepseek-v4-pro"
  timeout_seconds: 45
  prompt_version: "headline-v5-analytical"
  publication_epoch: 5
  cadence_minutes: {1: 30, 7: 60, 30: 360, 365: 1440}
  stale_minutes: {1: 60, 7: 120, 30: 720, 365: 2880}
  min_posts: 20
  min_authors: 10
  contested_ratio: "0.80"
  minimum_coverage: "0.75"
  surging_ratio: "1.50"
  rising_ratio: "1.15"
  steady_ratio: "0.85"
  episode_peak_ratio: "3.0"
  fingerprint_band_percent: 5
  evidence_policy_version: "adaptive-v1"
  evidence_reservoir_rank_limit: 32
  evidence_floor: 4
  evidence_lead_ceiling: 48
  evidence_comparison_ceiling: 12
  evidence_excerpt_characters: 1000
  evidence_provider_packet_bytes: 131072
  call_cap: 4
  max_body_en_chars: 240
  max_body_zh_cn_chars: 120
  task_expiry_seconds: 1800
  lease_seconds: 90
  retention_days: 90
  retention_rows_per_window: 20
  serving_enabled: null
  enqueue_enabled: null
  provider_calls_enabled: null
  control_revision: null

# Query-rot streak threshold (consecutive 0-result days before a query is
# auto-disabled). Override per-model for known low-volume ones.
query_rot_streak_threshold: 3
query_rot_streak_threshold_per_model:
  mimo: 5

# Reasons a post can be added to the review queue by the rule-based pipeline.
review_reasons:
  - low_engagement
  - off_topic
  - suspicious_actor
  - ambiguous_role

# Skip order when budget is exhausted mid-run. Plan 2026-07-11-002 (U3)
# reorders from the legacy Q1-Q6 keys to the post-consolidation call ids.
# Lowest-recall per-brand wide-net calls drop first under credit pressure;
# Call A (the curated X-list) is last because it carries the highest
# signal-per-tweet ratio.
degraded_skip_order:
  - B3
  - B2
  - B1
  - C2
  - C1
  - A

# Dashboard
dashboard:
  host: "0.0.0.0"
  port: 5000
  poll_seconds: 30
  # Window of post history rendered on the grid cards.
  window_days: 14

# v1.7: x.com list ID for Call A (list-based fan-in). See plan 2026-06-17-001 §"Call A — list-based fan-in".
x_monitor_list_id: 2067062923525275922

# v1.7.x: Optional Call C — per-brand brand-wide queries with a
# co-occurrence constraint. Use for brands whose tokens collide with
# unrelated common nouns ("mimo" matches the studio app; "kimi" matches
# the F1 driver; etc.). Each spec emits one extra API call per cycle.
#
# Shape: `(<tokens>) (<co_occurrence>) min_faves:<N>` — implicit AND
# between the token group and the co-occurrence group, so every result
# matches BOTH a brand token AND at least one co-occurrence term. Tokens
# are joined with OR; co_occurrence are joined with OR.
#
# Default is empty (no Call C emitted; v1.7 stays at 2 calls).
#
# Plan 2026-07-30-002 U3 (hybrid funnel): B1 is BARE (no co). B2/B3
# are HANDLE-ONLY (the new `handles:` field carries the @-prefixed
# Twitter handles — see x_monitor.query_plan.XQuerySpec). C* uses a
# 5-term minimal co allowlist (R8) instead of the full 22. No
# xiaomi/小米/moonshot in any co-occurrence list (R10). Optional
# `not_include` for stable hijacks is documented in the plan but
# U3 does NOT seed it; that's U5.
x_query_specs:
  # === C1: MiMo + Kimi + Yi + Llama with 5-term minimal co allowlist (R8/R10) ===
  # Plan 2026-07-30-002 U3: C* replaces the full 22-term co with the
  # shared 5-term minimal co. No xiaomi/小米/moonshot poison.
  - brands:
      mimo:   [MiMo, "Xiaomi MiMo", "小米 MiMo"]
      mistral:       [Mistral, Mixtral]
      moonshot_kimi: [Kimi, "Moonshot AI", 月之暗面, 暗面, MoonshotAI]
      yi:            [Yi, "01.AI", 零一万物, "Yi LLM", Yi-VL, Yi-Coder]
      llama:         [Llama, "Llama 3", "Llama 4", "Meta Llama", "Code Llama"]
    co_occurrence: [llm, model, api, agentic, huggingface]
    not_include: [f1, antonelli, mercedes, hamil, alonso, verstappen, "formula 1"]
    min_faves: 0
    call_id: C1
    notes: |
      Hybrid funnel U3 — C1 covers a 5-brand polyseme set (mimo/kimi/yi/llama + mistral) but co
      drops from 22 terms to the 5-term minimal allowlist
      (R8: llm, model, api, agentic, huggingface). xiaomi/小米/
      moonshot REMOVED from co (R10) — the foreign-first loss was
      high (55-75% of relevant non-EN samples lack those terms).
      The brand groups themselves still include `Xiaomi MiMo` and
      `moonshot_kimi` for direct match; co only needs to provide
      light AI-context.

      Moonshot F1 hijack mitigation moved from co to U5's
      optional `not_include` (R12). F1/antonelli/mercedes etc.
      are not in the co list anymore.

  # === C2: ERNIE + Upstage with 5-term minimal co + baidu/文心 (R9 optional) ===
  - brands:
      ernie:   [ERNIE, 文心一言]
      upstage: [Upstage, "Solar Pro", "Solar LLM", 업스테이지]
    co_occurrence: [llm, model, api, agentic, huggingface, baidu, 文心]
    min_faves: 0
    call_id: C2
    notes: |
      Hybrid funnel U3 — C2 keeps ERNIE + Upstage. Co collapses to
      5-term minimal allowlist + the two C2-specific optional terms
      (R9: baidu, 文心 — total 7 terms, under the ≤8 cap). xiaomi/
      小米/moonshot REMOVED (R10) — they were never relevant to
      ERNIE/Upstage.

  # === C3 (NEW in hybrid funnel): doubao + sensechat + kuaishou ===
  # Plan 2026-07-30-002 AE/R1: 7-call layout — adds C3 as a third
  # ambiguous-brand spec covering the previously-B2/B3 polysemes
  # that were not in any C spec.
  - brands:
      doubao:    [Doubao, ByteDance]
      sensechat: [SenseChat, SenseTime]
      kuaishou:  [Kuaishou, KwaiYii]
    co_occurrence: [llm, model, api, agentic, huggingface]
    min_faves: 0
    call_id: C3
    notes: |
      Hybrid funnel U3 — NEW C3 spec. Adds the third ambiguous-brand
      group. 5-term minimal co (R8). Foreign-language coverage for
      Doubao/ByteDance/SenseTime/Kuaishou is improved by the thin
      co vs the old full-22 list.

  # === B1: top-presence global brands, BARE (no co per R3) ===
  # Plan 2026-07-30-002 U3: B1 collapses from 22-term co to ZERO.
  # Bare keywords render `((brand_tokens)) min_faves:0` with NO
  # secondary paren (U2).
  - is_wide_net: true
    wide_net_brands: [minimax, qwen, deepseek, stepfun, hunyuan]
    brands: {}
    co_occurrence: []
    min_faves: 0
    call_id: B1
    notes: |
      Hybrid funnel U3 — B1 is BARE (R3). co_occurrence=[] triggers
      the U2 renderer's "omit secondary paren" path (R17/KTD4).
      The brand groups are read from DB via primary_keywords at
      render time; this config controls WHICH brands and ORDER.
      5 brands: minimax, qwen, deepseek, stepfun, hunyuan.

  # === B2: pure-brand OFFICIAL HANDLES ONLY (R4 + U2 handles field) ===
  # Hybrid funnel U3: B2 switches from wide-net brand_wide to
  # handle-only `@handle` OR-group. No co (R4). Each handle is
  # the official X account; "list:" is wrong operator semantics
  # for mentions (KTD3). Handles sourced from `brands_accounts`
  # with role=official.
  - handles:
      - deepseek_ai
      - Ali_TongyiLab
      - Alibaba_Qwen
      - hailuo_ai
      - MiniMax_AI
      - MiniMaxAgent
      - StepFun_ai
      - stepfunai
      - MistralAI
      - TencentHunyuan
      - Zai_org
      - ZhihuFrontier
      - AntLingAGI
      - robbyant_brain
      - TheInclusionAI
      - LG_AI_Research
      - SakanaAILabs
      - NVIDIAAI
      - NVIDIAAIDev
    brands: {}
    co_occurrence: []
    min_faves: 0
    call_id: B2
    notes: |
      Hybrid funnel U3 — B2 is HANDLE-ONLY (R4). Uses the new
      `handles:` field added to XQuerySpec by U2. Renderer emits
      `(@deepseek_ai OR @Ali_TongyiLab OR ...) min_faves:0` with
      NO co secondary (U2 handles branch handles `not spec.brands
      and spec.handles`).

  # === B3: other-brand OFFICIAL HANDLES ONLY (R5) ===
  - handles:
      - bytedanceoss
      - BytePlusGlobal
      - doubaoai
      - SenseTime_AI
      - Kling_ai
      - XiaomiMiMo
      - XiaomiMiMoDevs
      - Kimi_Moonshot
      - "01AI_Yi"
      - AIatMeta
      - ErnieforDevs
      - PaddlePaddle
      - upstageai
    brands: {}
    co_occurrence: []
    min_faves: 0
    call_id: B3
    notes: |
      Hybrid funnel U3 — B3 is HANDLE-ONLY (R5). Same shape as B2
      but covers the other-brand set.
