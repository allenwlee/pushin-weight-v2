# Render Blueprint — PushinWeight owner-only staging
# Every stateful runtime below is staging-owned. The harvest cron uses a
# never-occurring schedule and is invoked only with Render's manual Trigger Run.

services:
  - type: keyvalue
    name: pushinweight-staging-headlines-broker
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: web
    name: pushinweight-staging-web
    repo: https://github.com/allenwlee/pushin-weight-v2
    branch: staging
    autoDeployTrigger: commit
    runtime: python
    region: oregon
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn project.wsgi:application --log-file -
    healthCheckPath: /accounts/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: pushinweight-staging-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://pushinweight-staging-web.onrender.com
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pushinweight-staging-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: pushinweight-staging-headlines-broker
          property: connectionString
      - key: X_MONITOR_DEPLOYMENT_ENVIRONMENT
        value: staging
      - key: OLLIJA_STAGING_MODE
        value: "True"
      - key: OLLIJA_STAGING_ALLOWED_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STAGING_DATA_REFRESH_ENABLED
        value: "True"
      - key: STAGING_REFRESH_SOURCE_DATABASE_URL
        sync: false
      - key: X_MONITOR_HEADLINE_SERVING_ENABLED
        value: "True"
      - key: X_MONITOR_HEADLINE_ACTIVATION_STATE
        value: owner_override
      - key: X_MONITOR_HEADLINE_PUBLICATION_SOURCE
        value: prefer_per_brand
      - key: X_MONITOR_HEADLINE_CONTROL_REVISION
        value: staging-v23-per-brand-activation-20260831

  - type: worker
    name: pushinweight-staging-headlines
    repo: https://github.com/allenwlee/pushin-weight-v2
    branch: staging
    autoDeployTrigger: commit
    runtime: python
    region: oregon
    plan: starter
    buildCommand: ./build.sh
    startCommand: >-
      celery -A project worker -l INFO -Q trend-narratives --concurrency=1
      --prefetch-multiplier=1 --without-gossip --without-mingle
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pushinweight-staging-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: pushinweight-staging-headlines-broker
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: pushinweight-staging-headlines-broker
          property: connectionString
      - key: X_MONITOR_DEPLOYMENT_ENVIRONMENT
        value: staging
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: X_MONITOR_HEADLINE_PROVIDER_CALLS_ENABLED
        value: "True"
      - key: X_MONITOR_HEADLINE_ACTIVATION_STATE
        value: owner_override
      - key: X_MONITOR_HEADLINE_CONTROL_REVISION
        value: staging-v23-per-brand-activation-20260831

  - type: cron
    name: pushinweight-staging-harvest
    repo: https://github.com/allenwlee/pushin-weight-v2
    branch: staging
    autoDeployTrigger: commit
    runtime: python
    region: oregon
    plan: starter
    schedule: "0 0 31 2 *"
    buildCommand: ./build.sh
    startCommand: >-
      python manage.py run_cycle --staging-acceptance
      "${X_MONITOR_STAGING_ACCEPTANCE_CALL_ID:?staging acceptance call ID missing}"
      --json
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pushinweight-staging-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: pushinweight-staging-headlines-broker
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: pushinweight-staging-headlines-broker
          property: connectionString
      - key: X_MONITOR_DEPLOYMENT_ENVIRONMENT
        value: staging
      - key: X_MONITOR_STAGING_ACCEPTANCE_SERVICE
        value: pushinweight-staging-harvest
      - key: X_MONITOR_STAGING_ACCEPTANCE_ENABLED
        value: "True"
      - key: X_MONITOR_STAGING_ACCEPTANCE_CALL_ID
        value: A
      - key: X_MONITOR_LIST_ID
        value: "2067062923525275922"
      - key: TWITTERAPI_IO_SCHEDULED_API_KEY
        sync: false
      - key: TWITTERAPI_IO_ON_DEMAND_API_KEY
        sync: false
      # The effective translator/classifier URLs decide which one of these
      # service-scoped credentials the acceptance preflight requires.
      - key: ANTHROPIC_BASE_URL
        sync: false
      - key: X_MONITOR_CLASSIFIER_BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MINIMAX_API_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: X_MONITOR_HEADLINE_ENQUEUE_ENABLED
        value: "True"
      - key: X_MONITOR_HEADLINE_ACTIVATION_STATE
        value: owner_override
      - key: X_MONITOR_HEADLINE_CONTROL_REVISION
        value: staging-v23-per-brand-activation-20260831

databases:
  - name: pushinweight-staging-db
    databaseName: pushinweight_staging
    user: pushinweight_staging
    region: oregon
    plan: basic-256mb
    postgresMajorVersion: "18"
    ipAllowList: []
