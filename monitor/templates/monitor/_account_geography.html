<span class="account-geography geography-{{ geography.kind }}"
      data-geography-kind="{{ geography.kind }}"
      {% if geography.relationship_type %}data-geography-relationship="{{ geography.relationship_type }}"{% endif %}
      role="group" aria-label="{{ geography.accessible_label }}">
  {% for flag in geography.flags %}
    {% if not forloop.first and geography.kind == 'hierarchy' %}<span class="account-geography-elbow" aria-hidden="true"></span>{% endif %}
    <button type="button"
            class="account-geography-flag pw-inspection-trigger{% if geography.kind == 'hierarchy' %} {% if forloop.first %}is-parent{% else %}is-child{% endif %}{% endif %}"
            data-pw-inspection="{{ flag.label }}"
            aria-label="{{ flag.label }}" aria-expanded="false">
      <svg class="account-country-flag" viewBox="0 0 16 9" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false"><use href="#{{ flag.symbol_id }}"></use></svg>
    </button>
    {% if geography.kind == 'taiwan' and geography.text %}<span class="account-geography-connector" aria-hidden="true"></span>{% endif %}
  {% endfor %}
  {% if geography.text %}<button type="button" class="account-geography-text pw-inspection-trigger" data-pw-inspection="{{ geography.label }}" aria-label="{{ geography.label }}" aria-expanded="false">{{ geography.text }}</button>{% endif %}
</span>
