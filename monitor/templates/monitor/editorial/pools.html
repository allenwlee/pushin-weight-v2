{% load i18n %}{% if pool_controls %}<form class="chatter-pools" method="get">
{% for key, value in pool_controls.hidden %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}
<label>{% translate "Source language" %} <select name="source_lang"><option value="en"{% if pool_controls.source_lang == 'en' %} selected{% endif %}>English</option><option value="ja"{% if pool_controls.source_lang == 'ja' %} selected{% endif %}>日本語</option><option value="zh-cn"{% if pool_controls.source_lang == 'zh-cn' %} selected{% endif %}>简体中文</option></select></label>
<label>{% translate "Group" %} <select name="group"><option value="rest"{% if pool_controls.group == 'rest' %} selected{% endif %}>{% translate "Rest" %}</option><option value="giant"{% if pool_controls.group == 'giant' %} selected{% endif %}>{% translate "Giants" %}</option></select></label>
<label>{% translate "Read in" %} <select name="edition_lang"><option value="en"{% if pool_controls.edition_lang == 'en' %} selected{% endif %}>English</option><option value="ja"{% if pool_controls.edition_lang == 'ja' %} selected{% endif %}>日本語</option><option value="zh-cn"{% if pool_controls.edition_lang == 'zh-cn' %} selected{% endif %}>简体中文</option></select></label>
<button type="submit">{% translate "Show" %}</button></form>{% endif %}
