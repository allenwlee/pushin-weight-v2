<div class="dd-toolbar">
  <button type="button" data-dd-action="all" data-i18n="btn_all">{% if is_zh_chrome %}全选{% elif is_ja_chrome %}すべて{% else %}all{% endif %}</button>
  <button type="button" data-dd-action="clear" data-i18n="btn_clear">{% if is_zh_chrome %}清空{% elif is_ja_chrome %}クリア{% else %}clear{% endif %}</button>
  <button type="button" data-dd-action="other-only" data-i18n="btn_other">{% if is_zh_chrome %}仅其他{% elif is_ja_chrome %}その他のみ{% else %}other only{% endif %}</button>
</div>
