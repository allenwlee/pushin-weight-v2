validation:
  exact_count_tables:
    - accounts
    - brands
    - brands_companies
    - companies
    - posts
    - posts_brands
    - products
  required_nonempty_tables:
    - accounts
    - brands
    - posts
    - posts_brands
  latest_timestamp_table: posts
  latest_timestamp_column: created_at
  maximum_latest_timestamp_lag_seconds: 0
  forward_migration_count_deltas:
    core.0033_stage1c_frontier_organization_brands:
      brands: 2
      brands_companies: 2
  forward_migration_translation_count_deltas:
    core.0033_stage1c_frontier_organization_brands:
      brands.display_name_en: 2
  required_columns:
    accounts:
      - author_id
      - handle
      - bio_en
      - bio_zh_cn
    brands:
      - nickname
      - display_name_en
      - display_name_zh_cn
    posts:
      - tweet_id
      - author_id
      - text
      - text_en
      - text_zh_cn
      - created_at
      - lang_detected
    posts_brands:
      - post_id
      - brand_id
      - weight
    trend_narratives:
      - id
      - status
      - window_days
      - is_current
      - body_en
      - body_zh_hans
      - published_at
    trend_narrative_subjects:
      - id
      - trend_narrative_id
      - position
      - support_type
  translation_columns:
    posts:
      - text_en
      - text_zh_cn
    accounts:
      - bio_en
      - bio_zh_cn
    brands:
      - display_name_en
      - display_name_zh_cn
    companies:
      - display_name_en
      - display_name_zh_cn
  classification_tables:
