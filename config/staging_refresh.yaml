    - posts_brands_classification_states
    - posts_brands_discourse
    - posts_brands_mentions
    - posts_brands_product_labels
    - posts_brands_signals
    - posts_unsanctioned_flags

storage:
  target_disk_bytes: 16106127360
  required_reserve_ratio: 0.20
  local_free_space_multiplier: 2.0

quiescence:
  harvest_environment: staging
  broker_environment: CELERY_BROKER_URL
  queue_name: trend-narratives
  queue_namespace_pattern: trend-narratives*
  envelope_key: pushinweight:trend-narratives:latest-envelope:v1
  unacked_key: unacked
  unacked_index_key: unacked_index
  worker_probe_timeout_seconds: 2

database_lifecycle:
  marker_prefix: staging-refresh/v1
  shadow_prefix: pushinweight_staging_shadow_
  recovery_prefix: pushinweight_staging_recovery_
  retained_recoveries: 1
  administration_statement_timeout_seconds: 30
  cluster_lock_id: 8675309
  deploy_lock_timeout_seconds: 900
