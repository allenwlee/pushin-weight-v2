name: Staff identity and evidence

on:
  pull_request:
    paths:
      - 'core/**'
      - 'tests/**'
      - 'project/**'
      - 'pyproject.toml'
      - '.github/workflows/g1-staff-library.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staff-library-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: staff_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: staff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://staff_test:test@127.0.0.1:5432/staff_test
      STAFF_COLLECTION_NETWORK_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Check migration state
        run: python manage.py makemigrations --check --dry-run
      - name: PostgreSQL regressions (required skips fail)
        run: >-
          python -m pytest -q
          tests/test_person_identity.py tests/test_person_identity_corrections.py
          tests/test_person_affiliations.py tests/test_person_names.py tests/test_person_text.py
          tests/test_staff_library.py tests/test_staff_dossier.py
          tests/test_migration_060_person_names.py tests/test_migration_064_staff_sources.py
          tests/test_profile_snapshots.py tests/test_bio_change_personnel.py
          tests/test_targeted_extraction.py tests/test_intelligence_readers.py
          tests/test_stage1c_intelligence_schema.py tests/test_onboard_brand.py
