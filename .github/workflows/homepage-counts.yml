name: Homepage counts regression net

on:
  pull_request:
    paths:
      - 'core/**'
      - 'monitor/**'
      - 'tests/**'
      - 'project/**'
      - 'config/staging_refresh.yaml'
      - 'render*.yaml'
      - 'pyproject.toml'
      - '.github/workflows/homepage-counts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-counts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: homepage_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: homepage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://homepage_test:test@127.0.0.1:5432/homepage_test
      DEBUG: '1'
      STAFF_COLLECTION_NETWORK_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Check out Bridgewright
        uses: actions/checkout@v4
        with:
          repository: allenwlee/bridgewright
          ref: d0a5279ff1dcfab76f285b75a048b6611ee3c2d2
          ssh-key: ${{ secrets.BRIDGEWRIGHT_DEPLOY_KEY }}
          persist-credentials: false
          path: .ci-bridgewright
      - name: Check out production visual baseline
        uses: actions/checkout@v4
        with:
          # Fixed pre-change production revision. Update only with a reviewed visual change.
          ref: 260a5c068d1da59ef78b36c5152de2a39f0487fd
          persist-credentials: false
          path: .ci-visual-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]' './.ci-bridgewright' 'playwright==1.62.0' 'hypothesis>=6.138,<7'
      - name: Install browser runtime
        run: python -m playwright install --with-deps chromium
      - name: Capture production visual baseline on this runner
        working-directory: .ci-visual-baseline
        env:
          CYBER_QUAN_CAPTURE_ONLY: candidate
          CYBER_QUAN_CAPTURE_DIR: ${{ runner.temp }}/cyber-quan-reference
        run: python -m pytest -q tests/test_cyber_quan_visual_regression.py
      - name: Check migration state
        run: python manage.py makemigrations --check --dry-run
      - name: Native counts, caller parity and compatibility (required skips fail)
        run: >-
          python -m pytest -q
          tests/test_home_chart.py tests/test_home_chart_pulse.py
          tests/test_home_chart_materialization.py
          tests/test_home_count_summary_migrations.py tests/test_refresh_home_counts.py
          tests/test_home_count_render_config.py tests/test_public_home_window_cookie.py
          tests/test_reader_stylesheets.py
          tests/test_home_v22_browser.py::PublicTrackedBrandsBrowserTests::test_one_meta_deselection_recovers_from_script_and_chart_gateway_errors
          tests/test_home_v22_browser.py::PublicTrackedBrandsBrowserTests::test_descending_windows_and_timeout_feedback_use_one_click
          tests/test_home_v22_browser.py::HomeV22BrowserTests::test_long_window_switches_commit_before_the_client_timeout
          tests/test_enrichment_worker.py::test_claim_allows_visible_synthesis_demand_to_commit
          tests/test_trend_narrative_projection.py tests/test_taxonomy_compatibility_surfaces.py
          tests/test_home_v22_feed_row_shape.py tests/test_home_v22_filter_pills.py
          tests/test_home_v22_topbar_layout.py tests/test_render_headline_topology.py
          tests/test_dashboard_each.py
          tests/staging_refresh/test_policy.py tests/ollija
          tests/test_collection_schema_regression_net.py::test_concrete_application_models_match_database_columns
          tests/test_home_v22_browser.py::HomeV22BrowserTests::test_anonymous_filters_window_and_pulse_share_one_request_state
          tests/test_home_v22_browser.py::HomeV22BrowserTests::test_per_brand_narratives_render_bilingually_as_semantic_cards
          tests/test_ui_assurance_gate.py
      - name: Bridgewright candidate interaction assurance
        env:
          CYBER_QUAN_REFERENCE_DIR: ${{ runner.temp }}/cyber-quan-reference
        run: >-
          python -m tests.ui_assurance.gate --scope candidate
          --candidate-revision "$GITHUB_SHA"
          --performance-mode not-required
          --performance-rationale "Candidate performance is measured separately against representative data before production."
      - name: Browser projection and timezone regressions
        run: |
          node tests/test_pw_chart_filter.js
          node tests/test_pw_feed_formatter.js
          node tests/test_pw_tz.js
