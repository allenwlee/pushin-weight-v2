name: Benchmark and download collector

on:
  pull_request:
    paths:
      - 'scripts/benchmark_download_collector/**'
      - 'monitor/management/commands/export_benchmark_inputs.py'
      - 'monitor/management/commands/backfill_hf_*.py'
      - 'monitor/management/commands/backfill_*history.py'
      - 'monitor/management/commands/import_hf_backfill.py'
      - 'core/hf_metadata_client.py'
      - 'core/account_identity.py'
      - 'core/intelligence_readers.py'
      - 'monitor/management/commands/load_seed.py'
      - 'tests/test_load_seed_account_observation.py'
      - 'tests/test_intelligence_readers.py'
      - 'core/apps.py'
      - 'core/benchmark*.py'
      - 'core/measurement*.py'
      - 'monitor/benchmark_views.py'
      - 'monitor/urls.py'
      - 'project/settings.py'
      - 'monitor/static/benchmark-pulse.*'
      - 'monitor/templates/monitor/benchmark_pulse.html'
      - 'monitor/management/commands/*benchmark*.py'
      - 'monitor/management/commands/configure_measurement_taxonomy.py'
      - 'tests/fixtures/benchmark_download_collector/**'
      - 'tests/test_measurement*.py'
      - 'tests/test_account_source_identity.py'
      - 'tests/test_benchmark_pulse*.py'
      - 'tests/conftest.py'
      - 'core/models.py'
      - 'core/migrations/**'
      - 'tests/test_benchmark*.py'
      - 'tests/test_hf_metadata_client.py'
      - 'tests/test_product_identity.py'
      - 'pyproject.toml'
      - '.github/workflows/benchmark-download-collector.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-collector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-net:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: benchmark_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: benchmark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://benchmark_test:test@127.0.0.1:5432/benchmark_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev,benchmark]'
      - name: Focused lint
        run: >-
          python -m ruff check scripts/benchmark_download_collector
          monitor/management/commands/export_benchmark_inputs.py
          tests/test_benchmark*.py core/hf_metadata_client.py
          core/benchmark*.py core/measurement*.py monitor/benchmark_views.py
          monitor/management/commands/*benchmark*.py
          monitor/management/commands/backfill_hf_*.py monitor/management/commands/backfill_*history.py
          monitor/management/commands/import_hf_backfill.py monitor/management/commands/configure_measurement_taxonomy.py
          tests/test_benchmark_pulse_views.py tests/test_measurement*.py
      - name: Offline collector and PostgreSQL regression net
        run: >-
          python -m pytest -q tests/test_benchmark*.py
          tests/test_hf_metadata_client.py tests/test_product_identity.py
          tests/test_benchmark_pulse_views.py tests/test_measurement*.py
          tests/test_account_source_identity.py tests/test_hf_catalog_persistence.py
          tests/test_list_membership_reconciliation.py tests/test_profile_snapshots.py
          tests/test_product_verification.py tests/test_staff_library.py tests/test_staff_dossier.py
          tests/test_load_seed_account_observation.py tests/test_intelligence_readers.py
