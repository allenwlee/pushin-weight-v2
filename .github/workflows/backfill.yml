name: Historical X backfill

on:
  pull_request:
    paths:
      - 'monitor/cycle.py'
      - 'monitor/metrics_refresh.py'
      - 'monitor/backfill_resources.py'
      - 'monitor/backfill_collection.py'
      - 'monitor/backfill_prefetch.py'
      - 'monitor/backfill_enrichment.py'
      - 'monitor/backfill_direct.py'
      - 'monitor/backfill_retry.py'
      - 'monitor/backfill_staging.py'
      - 'monitor/backfill_recovery.py'
      - 'monitor/backfill_list_roles.py'
      - 'monitor/list_membership.py'
      - 'monitor/management/commands/sync_backfill_list_roles.py'
      - 'scripts/backfill_list_roles_production.sql'
      - 'x_monitor/corrected_inference.py'
      - 'tests/fixtures/backfill_list_roles_export.json'
      - 'tests/test_list_membership_reconciliation.py'
      - 'tests/test_call_a_role_routing.py'
      - 'core/provider_batches.py'
      - 'core/models.py'
      - 'core/migrations/**'
      - 'core/collection*.py'
      - 'monitor/post_artifacts.py'
      - 'monitor/management/commands/backfill.py'
      - 'monitor/management/commands/run_backfill.py'
      - 'scripts/backfill_campaign.py'
      - 'scripts/backfill_month.py'
      - 'scripts/backfill_verify.py'
      - 'monitor/run_lock.py'
      - 'x_monitor/apify.py'
      - 'x_monitor/config.py'
      - 'config.yaml'
      - 'tests/test_metrics_refresh.py'
      - 'tests/test_metrics_refresh_regression_net.py'
      - 'x_monitor/literal_translation.py'
      - 'x_monitor/deepinfra*.py'
      - 'x_monitor/deferred_inference.py'
      - 'x_monitor/attribution.py'
      - 'tests/test_provider_batches.py'
      - 'tests/test_deepinfra_batch.py'
      - 'tests/test_backfill*.py'
      - 'tests/test_run_backfill_command.py'
      - 'tests/test_literal_translation_plaintext.py'
      - 'tests/test_translator_literal.py'
      - 'tests/test_bounded_classifier_client.py'
      - 'tests/test_cycle_cursor_wiring.py'
      - 'tests/test_cycle_run_lock.py'
      - 'tests/test_cycle_error_counters.py'
      - 'tests/test_harvest_cursor_lifecycle.py'
      - 'tests/test_cycle_search_caps.py'
      - 'tests/test_hybrid_harvest_regression_net.py'
      - 'tests/test_harvest_surface_regression_net.py'
      - 'tests/conftest.py'
      - 'tests/test_account*.py'
      - 'tests/test_publisher_accounts.py'
      - '.github/workflows/backfill.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-backfill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: backfill_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: backfill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://backfill_test:test@127.0.0.1:5432/backfill_test
      STAFF_COLLECTION_NETWORK_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Lint recovery command, resource guard and tests
        run: >-
          python -m ruff check monitor/backfill_resources.py
          monitor/backfill_collection.py tests/test_backfill_collection.py
          monitor/backfill_prefetch.py tests/test_backfill_prefetch.py
          tests/test_backfill_prefetch_transport.py
          scripts/backfill_campaign.py scripts/backfill_month.py scripts/backfill_verify.py
          tests/test_backfill_campaign.py tests/test_backfill_month.py tests/test_backfill_verify.py
          monitor/management/commands/run_backfill.py tests/test_run_backfill_command.py
          monitor/backfill_enrichment.py core/provider_batches.py
          monitor/backfill_direct.py tests/test_backfill_direct_enrichment.py
          tests/test_backfill_enrichment_control.py tests/test_backfill_account_merge_migration.py
          tests/test_account_user_about_model.py
          x_monitor/deepinfra_batch.py x_monitor/deferred_inference.py
          tests/test_backfill_native_enrichment.py tests/test_provider_batches.py tests/test_deepinfra_batch.py
          monitor/management/commands/backfill.py tests/test_backfill_resources.py
          tests/test_backfill_pipeline.py tests/test_backfill_quarantined.py
          monitor/backfill_retry.py tests/test_backfill_retry_statuses.py tests/test_backfill_spend_basis.py
      # Runs before the long suite, which can reach the job time limit, so the
      # retry and spend-basis checks always finish.
      - name: Retry and spend-basis regressions (required skips fail)
        run: >-
          python -m pytest -q tests/test_backfill_retry_statuses.py tests/test_backfill_spend_basis.py
          tests/test_backfill_staging_retry.py
          tests/test_backfill_campaign.py::test_manifest_without_new_window_fields_keeps_its_july_shape
          tests/test_backfill_campaign.py::test_saved_spend_basis_reaches_the_enrichment_policy_only_when_present
          tests/test_backfill_campaign.py::test_window_spend_basis_is_frozen_into_the_manifest
          tests/test_run_backfill_command.py::test_window_spend_basis_is_planned_into_the_manifest_without_jobs
          tests/test_run_backfill_command.py::test_unknown_window_field_is_rejected_without_jobs
          tests/test_backfill_direct_enrichment.py::test_spend_basis_decides_the_real_direct_admission
          tests/test_backfill_native_enrichment.py::test_spend_basis_is_frozen_on_the_first_provider_batch
      - name: Backfill and scheduled-path regressions (required skips fail)
        run: >-
          python -m pytest -q tests/test_apify.py tests/test_post_enrichment_queue.py
          tests/test_metrics_refresh.py tests/test_metrics_refresh_regression_net.py
          tests/test_enrichment_attempt_deadline.py tests/test_backfill_quarantined.py
          tests/test_backfill_pipeline.py tests/test_backfill_resources.py
          tests/test_backfill_collection.py tests/test_collection_jobs.py tests/test_collection_state.py
          tests/test_backfill_prefetch.py tests/test_backfill_prefetch_transport.py
          tests/test_backfill_campaign.py tests/test_backfill_month.py tests/test_backfill_verify.py
          tests/test_run_backfill_command.py
          tests/test_backfill_native_enrichment.py tests/test_provider_batches.py
          tests/test_backfill_direct_enrichment.py
          tests/test_backfill_enrichment_control.py tests/test_backfill_account_merge_migration.py
          tests/test_deepinfra_batch.py tests/test_deepinfra.py
          tests/test_original_content_models.py tests/test_original_content_backfill.py
          tests/test_cycle_plaintext_translation.py
          tests/test_bounded_classifier_client.py tests/test_cycle_cursor_wiring.py
          tests/test_cycle_run_lock.py tests/test_twitterapi_caller_shape.py
          tests/test_harvest_cursor_lifecycle.py tests/test_cycle_search_caps.py
          tests/test_cycle_error_counters.py tests/test_hybrid_harvest_regression_net.py
          tests/test_harvest_surface_regression_net.py
          tests/test_literal_translation_plaintext.py tests/test_translator_literal.py
          tests/test_account_extensions.py tests/test_account_extensions_migration.py
          tests/test_publisher_accounts.py tests/test_collection_schema_regression_net.py
          tests/test_account_user_about_model.py

  # The run-boundary, list-role sync, final-attempt grant and exit-status
  # fixes run in their own job, so their database tests finish inside a
  # time limit the long suite above can exhaust.
  backfill-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: backfill_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: backfill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://backfill_test:test@127.0.0.1:5432/backfill_test
      STAFF_COLLECTION_NETWORK_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Lint run-boundary, list-role, grant and exit-status changes
        run: >-
          python -m ruff check monitor/backfill_staging.py monitor/backfill_recovery.py
          monitor/backfill_list_roles.py monitor/management/commands/sync_backfill_list_roles.py
          x_monitor/corrected_inference.py
          tests/test_backfill_staging.py tests/test_cycle_search_caps.py tests/test_backfill_list_roles.py
          tests/test_backfill_contract_recovery.py tests/test_backfill_cached_replay.py
      - name: Run-boundary, list-role, grant and exit-status regressions (required skips fail)
        run: >-
          python -m pytest -q tests/test_backfill_staging.py tests/test_cycle_search_caps.py
          tests/test_backfill_list_roles.py tests/test_list_membership_reconciliation.py
          tests/test_call_a_role_routing.py
          tests/test_backfill_contract_recovery.py tests/test_backfill_cached_replay.py
          tests/test_backfill_direct_enrichment.py::test_defer_mode_still_defers_exhausted_posts_left_out_of_a_grant
          tests/test_run_backfill_command.py::test_final_assessment_names_only_its_unverified_windows
          tests/test_run_backfill_command.py::test_unverified_campaign_assessment_exits_3_after_its_receipts_are_saved
          tests/test_run_backfill_command.py::test_unverified_phase_assessment_exits_3_after_verified_collection
          tests/test_run_backfill_command.py::test_unverified_final_assessment_is_a_failed_process_exit
          tests/test_run_backfill_command.py::test_verified_final_assessment_exits_normally
          tests/test_run_backfill_command.py::test_without_evaluate_at_end_the_result_keeps_todays_exit
          tests/test_run_backfill_command.py::test_saved_campaign_can_select_a_new_exact_runtime_without_rewriting_instructions
          tests/test_run_backfill_command.py::test_aggregate_execution_mode_does_not_change_saved_manifest
