# {{AGENT_ATTRIBUTION}}
# x-monitor configuration. PR-reviewable; changes here trigger a re-run via
# LaunchAgent WatchPaths (only data/queries/ is watched, this file is the
# config; restart manually after editing).

# Models to monitor. Adding a model = adding model_id here + an INSERT
# into `brands_accounts` (canonical) + an INSERT into `account_handle`
# for any new handles. No code change.
#
# Plan 2026-07-11-001 retired data/queries/<brand>.yaml.
# Plan 2026-07-11-002 (U4) retired data/accounts/<brand>.yaml; the
# runtime source for per-brand official/staff handles is the
# `brands_accounts` DB table (joined to `accounts` and `roles`,
# filtered to role_id IN (2, 3)).
enabled_models:
  - minimax
  - qwen
  - deepseek
  - glm
  - mimo
  - moonshot_kimi
  - inclusionai
  - mistral
  - stepfun
  - ernie
  - hunyuan
  - llama
  - nemo_megatron
  - doubao
  - yi
  - sensechat
  - exaone
  - kuaishou
  - sakana_ai
  - upstage
# v1.7.x Call B group split. The union of all enabled_models' brand
# tokens (loaded from data/queries/<brand>.yaml Q2/Q3/Q5/Q6 first
# paren) exceeds the 512-char X advanced-search cap once we add the
# 9 new brands (Llama, NeMo, Doubao, Yi, SenseChat, EXAONE, Karakuri,
# Kuaishou, Upstage). Splitting into three semantic groups keeps each
# Call B under cap:
#   B1: top-presence / global brands (8 brands, ~280 chars)
#   B2: Chinese-language brands (7 brands, ~360 chars)
#   B3: specialized / smaller brands (5 brands, ~245 chars)
# When `call_b_groups` is absent or null, plan_calls emits one Call B
# spanning all enabled_models (legacy v1.7 behavior). Set to null to
# disable the split.
call_b_groups:
  - [llama, minimax, qwen, deepseek, mistral, stepfun, ernie, hunyuan]
  - [doubao, glm, moonshot_kimi, mimo, sensechat, yi, inclusionai]
  - [nemo_megatron, exaone, sakana_ai, kuaishou, upstage]

# Daily TwitterAPI.io budget (pay-per-use). Each unit = 1 tweet returned by
# advanced_search. 333/day gives 6x headroom over the 9x5x50=2250 upper bound
# from SC1. At $0.15/1k tweets, a full 333/day is ~$0.05/day = ~$1.50/mo.
daily_ceiling: 333

# Reply-chain cluster threshold (Q3). Tune via PR.
clustering:
  min_commenters: 3
  min_posts: 2

# Search caps for the main-loop advanced_search call (U1, 2026-07-02).
# All three are operator-tunable without a code edit. Defaults match
# the prior hardcoded values; omit this block to use defaults.
#   max_results   tweets per logical call (default 50)
#   max_per_page  TwitterAPI.io per-page request size (default 20)
#   max_pages     pagination safety cap (default 5)
# Credit math at defaults: 5 pages × 20 tweets = 100 tweets = ~$0.015.
search:
  max_results: 50
  max_per_page: 20
  max_pages: 5

# Query-rot streak threshold (consecutive 0-result days before a query is
# auto-disabled). Override per-model for known low-volume ones.
query_rot_streak_threshold: 3
query_rot_streak_threshold_per_model:
  mimo: 5

# Reasons a post can be added to the review queue by the rule-based pipeline.
review_reasons:
  - low_engagement
  - off_topic
  - suspicious_actor
  - ambiguous_role

# Skip order when budget is exhausted mid-run. Plan 2026-07-11-002 (U3)
# reorders from the legacy Q1-Q6 keys to the post-consolidation call ids.
# Lowest-recall per-brand wide-net calls drop first under credit pressure;
# Call A (the curated X-list) is last because it carries the highest
# signal-per-tweet ratio.
degraded_skip_order:
  - B3
  - B2
  - B1
  - C2
  - C1
  - A

# Dashboard
dashboard:
  host: "0.0.0.0"
  port: 5000
  poll_seconds: 30
  # Window of post history rendered on the grid cards.
  window_days: 14

# v1.7: x.com list ID for Call A (list-based fan-in). See plan 2026-06-17-001 §"Call A — list-based fan-in".
x_monitor_list_id: 2067062923525275922

# v1.7.x: Optional Call C — per-brand brand-wide queries with a
# co-occurrence constraint. Use for brands whose tokens collide with
# unrelated common nouns ("mimo" matches the studio app; "kimi" matches
# the F1 driver; etc.). Each spec emits one extra API call per cycle.
#
# Shape: `(<tokens>) (<co_occurrence>) min_faves:<N>` — implicit AND
# between the token group and the co-occurrence group, so every result
# matches BOTH a brand token AND at least one co-occurrence term. Tokens
# are joined with OR; co_occurrence are joined with OR.
#
# Default is empty (no Call C emitted; v1.7 stays at 2 calls).
x_query_specs:
  # Multi-brand spec — covers both MiMo and Kimi in one Call C. The
  # primary group uses Call B's per-brand paren structure (one paren
  # per brand) so the post-fetch attribute_to_brands regex can route
  # each result to the right brand by which per-brand paren matched.
  # Co-occurrence is the union of both brands' preferred terms
  # (over-permissive vs. the per-brand intersection; the post-fetch
  # regex still routes correctly).
  - brands:
      mimo:   [MiMo, "Xiaomi MiMo", "小米 MiMo"]
      moonshot_kimi: [Kimi, "Moonshot AI", 月之暗面, 暗面, MoonshotAI]
      yi:            [Yi, "01.AI", 零一万物, "Yi LLM", Yi-VL, Yi-Coder]
      llama:         [Llama, "Llama 3", "Llama 4", "Meta Llama", "Code Llama", "Muse Spark"]
    co_occurrence: [api, llm, model, xiaomi, 小米, moonshot, chatbot, weights, gguf, ollama, code, coding, agent, agentic, benchmark, reasoning, release, "open source", huggingface, inference, moe, "tool calling"]
    min_faves: 0
    call_id: C1
    notes: |
      Co-occurrence list broadened on 2026-06-25 per plan
      docs/plans/2026-06-25-001-refactor-b-and-c-calls-for-max-inclusion-plan.md
      (live x_keyword_search / x_semantic_search tests surfaced relevant
      posts that needed code / coding / agent / agentic / benchmark /
      reasoning / release / "open source" / huggingface / inference /
      moe / "tool calling" terms to match). The 12 new terms are
      additive; the original 10 terms are kept for backward compat.
      Tested length: under 512-char cap.

      MiMo: bare "mimo" matches Mimo Studio (kids' video app); "xiaomi"
      alone matches phone posts. xiaomi/小米 co-occurrence terms exclude
      phone-only false positives.
      Kimi: "kimi" is a Turkish interrogative ("who?") and a Japanese
      second-person pronoun (きみ); both are common-word false
      positives. moonshot/chatbot co-occurrence terms exclude
      non-AI uses. F1 driver Kimi Antonelli hijack is mitigated by
      data/filters/moonshot_kimi.yaml must_have_none (F1, antonelli,
      mercedes, ...). Bare "moonshot" is intentionally absent from
      the brand group — matches Moonshot crypto exchange spam, not
      Moonshot AI.

      2026-07-02 (U5 review, plan docs/plans/2026-07-02-001):
      Review-only unit — no term-list change in this unit. The
      co-occurrence list stands at 22 OR-terms across the 4 covered
      brands (mimo, moonshot_kimi, yi, llama); this is already the
      most-permissive shape consistent with keeping the AND-filter's
      intent (post-fetch regex routes each result to a specific brand).
      Upstage moved to C2 on 2026-07-11 to fix a substring leak:
      bare `Solar` in C1's Upstage brand OR-group matched "solar winds"
      in the post-fetch AND-filter (the leak path that produced
      "Any Surface model" → upstage false-positive on 2026-07-10).
      Dropping bare `Solar` from C2's Upstage tokens closes the leak
      at the cost of recall for posts that mention only the bare word
      "Solar" (rare in practice — most Upstage-coverage posts say
      "Upstage Solar", "Solar Pro", or "업스테이지").

      2026-07-11 (operator directive): Upstage moved from C1 to C2.
      C2 now covers ERNIE + Upstage; bare `Solar` token dropped from
      the Upstage OR-group to eliminate the substring collision with
      "solar" in everyday English (solar wind, solar panel, solar
      energy, etc.). Length: C1 461 chars, C2 282 chars — both
      comfortably under the 512-char cap.

  # ERNIE (Baidu 文心一言) — single-brand spec. "ERNIE" collides with
  # the Sesame Street character and (less commonly) the Bert variant;
  # "文心" alone is rare but ambiguous. Bare "文心一言" is unambiguous
  # and the safest token; "ERNIE" is kept for English-language coverage.
  # Co-occurrence terms require an AI/LLM/dev context (api/llm/model/
  # baidu/文心/code/coding/agent/...), which excludes Sesame Street
  # threads. Was not in C1 (C1 has 7 chars of headroom only —
  # adding ERNIE would have exceeded the 512-char cap; see
  # docs/reference/twitterapi-live-queries-by-model.md:212).
  # Origin: plan docs/plans/2026-06-25-001 §"Implementation Units"
  # discusses deduping models from A and B that already exist in C;
  # ERNIE was the deferred member of that dedup.
  - brands:
      ernie:   [ERNIE, 文心一言]
      upstage: [Upstage, "Solar Pro", "Solar LLM", 업스테이지]
    co_occurrence: [api, llm, model, baidu, 文心, chatbot, weights, gguf, ollama, code, coding, agent, agentic, benchmark, reasoning, release, "open source", huggingface, inference, moe, "tool calling"]
    min_faves: 0
    call_id: C2
    notes: |
      2026-07-09 (plan 2026-07-09-001 follow-up): ERNIE was originally
      discussed in plan 2026-06-25-001 as the deferred 6th brand of
      the C spec dedup, but the C1 spec was already at 505/512 chars
      so we couldn't add ERNIE's paren group to C1 without either
      dropping C1's co-occurrence terms or exceeding cap. The fix
      is a separate C2 spec (this entry).

      Token choice: "ERNIE" (English) + "文心一言" (Chinese product
      name). Bare "文心" is intentionally absent — it appears in
      Sesame Street contexts and a few 文心兰 (orchid) product pages;
      the baidu/文心 co-occurrence terms carry the disambiguation
      load.

      Co-occurrence terms mirror C1's 22-term list with these swaps:
      - dropped "xiaomi" + "小米" (ERNIE-irrelevant)
      - added "baidu" + "文心" (Baidu/ERNIE disambiguators)

      2026-07-11 (operator directive): Upstage moved here from C1.
      C2's Upstage brand OR-group is `[Upstage, "Solar Pro", "Solar LLM",
      업스테이지]` — bare `Solar` is intentionally DROPPED. The bare
      `Solar` token in C1's prior Upstage OR-group matched substring
      "solar" in everyday English ("solar wind", "solar panel",
      "solar energy"), and combined with the generic `model` co-occurrence
      term on the AND-side, leaked posts like "Any Surface model" +
      "solar winds" into Upstage false positives. The 3-product-name
      tokens ("Solar Pro", "Solar LLM", 업스테이지) keep precision-recall
      intact for actual Upstage coverage (most Upstage posts use a
      product name) while closing the substring leak.

      Tested length: 282 chars (cap 512, headroom 230).

  # Plan 2026-07-11-002 (U3) — wide-net B-call revival. Each B-spec
  # is `is_wide_net: true` with an empty `brands:` map and a
  # `wide_net_brands:` list. The renderer reads per-brand tokens
  # from `brand_keywords.is_primary=1` rows via the
  # `primary_keywords` kwarg. Token source is the DB, not the
  # config; the config controls which brands participate and in what
  # order. Co-occurrence lists are shared with C1's 22-term list as
  # a first cut (a follow-up probe may trim per group).
  #
  # The v1.7 group boundaries (B1 = top-presence / global, B2 =
  # Chinese-language, B3 = specialized / smaller) are reused — the
  # v1.7 split kept each Call B under 512 chars because each brand
  # contributed only the lean Q2 paren group. With the curated
  # `is_primary=1` subset (2-4 tokens per brand), the same shape
  # still fits under cap. Tested live: B1=473 chars, B2=470, B3=375.
  - is_wide_net: true
    wide_net_brands: [minimax, qwen, deepseek, mistral, stepfun, hunyuan]
    brands: {}
    co_occurrence: [api, llm, model, xiaomi, 小米, moonshot, chatbot, weights, gguf, ollama, code, coding, agent, agentic, benchmark, reasoning, release, "open source", huggingface, inference, moe, "tool calling"]
    min_faves: 0
    call_id: B1
    notes: |
      B1 = top-presence / global brands (6 brands after dedup). When credits
      are tight, B1 drops before C2 (co-occurrence-constrained per-
      brand). The 6 brand-groups render under 512 chars on the live
      primary subset. The original 8 included `llama` and `ernie`, which
      are also covered by C1 and C2 respectively (co-occurrence-constrained);
      per the dedup decision (operator directive 2026-07-11), those brands
      are covered exclusively by the C-specs to avoid duplicate TwitterAPI
      credit spend on the wide-net path.

  - is_wide_net: true
    wide_net_brands: [doubao, glm, sensechat, inclusionai]
    brands: {}
    co_occurrence: [api, llm, model, xiaomi, 小米, moonshot, chatbot, weights, gguf, ollama, code, coding, agent, agentic, benchmark, reasoning, release, "open source", huggingface, inference, moe, "tool calling"]
    min_faves: 0
    call_id: B2
    notes: |
      B2 = Chinese-language brands (4 brands after dedup). The original
      7 included `moonshot_kimi`, `mimo`, and `yi`, which are also
      covered by C1 (co-occurrence-constrained). Per the dedup decision
      (operator directive 2026-07-11), those brands are covered
      exclusively by C1 to avoid duplicate TwitterAPI credit spend on
      the wide-net path.

  - is_wide_net: true
    wide_net_brands: [nemo_megatron, exaone, sakana_ai, kuaishou]
    brands: {}
    co_occurrence: [api, llm, model, xiaomi, 小米, moonshot, chatbot, weights, gguf, ollama, code, coding, agent, agentic, benchmark, reasoning, release, "open source", huggingface, inference, moe, "tool calling"]
    min_faves: 0
    call_id: B3
    notes: |
      B3 = specialized / smaller brands (4 brands after dedup). The
      original 5 included `upstage`, which is also covered by C1
      (co-occurrence-constrained). Per the dedup decision (operator
      directive 2026-07-11), upstage is covered exclusively by C1 to
      avoid duplicate TwitterAPI credit spend on the wide-net path.
