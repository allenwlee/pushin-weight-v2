# {{AGENT_ATTRIBUTION}}
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x-monitor"
version = "0.1.0"
description = "Daily multi-language X monitoring for the 9 v1 Chinese AI models"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6",
    "python-dateutil>=2.9",
    "pydantic>=2",
    "jinja2>=3",
    "flask>=3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
x-monitor = "x_monitor.__main__:main"

[tool.setuptools.packages.find]
include = ["x_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
