# {AGENT_ATTRIBUTION}
# sensechat query library.
queries:
  - id: Q1
    query_string: '(SenseChat OR SenseNova OR SenseTime OR 商汤 OR 日日新) min_faves:5'
    max_results: 50
    enabled: true
    min_faves: 5
    notes: Brand-name Q1 fallback; switch to from:SenseTimeAI when operator confirms SenseTime's official handle.
  - id: Q2
    query_string: '(SenseChat OR SenseNova OR SenseTime OR 商汤 OR 日日新) (how OR 怎么 OR 教程 OR tutorial OR guide) min_faves:2'
    max_results: 50
    enabled: true
    min_faves: 2
  - id: Q3
    query_string: '(SenseChat OR SenseNova OR SenseTime OR 商汤 OR 日日新) (broken OR fails OR bad OR 翻车 OR 不好) min_faves:1'
    max_results: 50
    enabled: true
    min_faves: 1
  - id: Q4
    query_string: '(SenseChat OR SenseNova OR SenseTime OR 商汤 OR 日日新) min_faves:5'
    max_results: 50
    enabled: true
    min_faves: 5
    notes: Brand-name Q4 fallback; switch to to:SenseTimeAI when confirmed.
  - id: Q5
    query_string: '(SenseChat OR SenseNova OR SenseTime OR 商汤 OR 日日新) (benchmark OR eval OR paper OR github OR code OR 开源) min_faves:3'
    max_results: 50
    enabled: true
    min_faves: 3
  - id: Q6
    query_string: '(SenseChat OR SenseNova OR SenseTime OR 商汤 OR 日日新) (amazing OR incredible OR "love it" OR best OR "mind blowing" OR 🤯 OR 卧槽 OR 太强了) min_faves:5'
    max_results: 50
    enabled: true
    min_faves: 5
    notes: 5x min_faves to filter for unequivocally impressed (praise-only signal).
