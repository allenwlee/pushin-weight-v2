# {{AGENT_ATTRIBUTION}}
# Mistral AI query library (v1: minimal Q1+Q2; Q3-Q6 land in v1.1 if Mistral
# generates enough volume to need them). Brand-name Q1 fallback because the
# official @MistralAI handle is unconfirmed as of 2026-06-17; the context
# disambiguator (AI OR model OR LLM OR 7B OR 8x7B) plus -weather -meteorology
# filters out the weather brand.
queries:
  - id: Q1
    query_string: '("Mistral" OR "Mixtral") (AI OR model OR LLM OR 7B OR 8x7B) -weather -meteorology min_faves:5'
    expected_signal: release
    max_results: 50
    enabled: true
    min_faves: 5
    notes: Brand-name Q1 fallback; switch to from:MistralAI if the official handle is confirmed.
  - id: Q2
    query_string: '("Mistral" OR "Mixtral") (how OR tutorial OR guide OR 教程) min_faves:2'
    expected_signal: community_question
    max_results: 50
    enabled: true
    min_faves: 2
  - id: Q3
    query_string: '("Mistral" OR "Mixtral") (broken OR fails OR bad OR "not working") min_faves:1'
    expected_signal: criticism
    max_results: 50
    enabled: true
    min_faves: 1
  - id: Q4
    query_string: 'to:MistralAI min_faves:5'
    expected_signal: commenter_capture
    max_results: 50
    enabled: true
    min_faves: 5
    notes: May be 0 results until the official handle is confirmed; harmless.
  - id: Q5
    query_string: '("Mistral" OR "Mixtral") (benchmark OR eval OR paper OR github OR code OR 开源) min_faves:3'
    expected_signal: other
    max_results: 50
    enabled: true
    min_faves: 3
  - id: Q6
    query_string: '("Mistral" OR "Mixtral") (amazing OR incredible OR "love it" OR best OR "mind blowing" OR 🤯) min_faves:5'
    expected_signal: praise
    max_results: 50
    enabled: true
    min_faves: 5
