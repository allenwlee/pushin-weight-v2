# {{AGENT_ATTRIBUTION}}
# Tencent Hunyuan (腾讯混元) query library (v1: minimal Q1+Q2; Q3-Q6 land in v1.1).
# Brand-name Q1 fallback because the official Hunyuan handle is unconfirmed;
# the context disambiguator (LLM OR model OR Tencent OR 混元 OR 腾讯) filters out
# non-AI references to "Hunyuan" (the Chinese philosophical term).
queries:
  - id: Q1
    query_string: '("Hunyuan" OR "混元" OR "腾讯混元") (LLM OR model OR Tencent OR 混元 OR 腾讯) min_faves:5'
    max_results: 50
    enabled: true
    min_faves: 5
    notes: Brand-name Q1 fallback; switch to from:HunyuanAI if the official handle is confirmed.
  - id: Q2
    query_string: '("Hunyuan" OR "混元" OR "腾讯混元") (how OR tutorial OR guide OR 教程 OR 怎么) min_faves:2'
    max_results: 50
    enabled: true
    min_faves: 2
  - id: Q3
    query_string: '("Hunyuan" OR "混元" OR "腾讯混元") (broken OR fails OR bad OR 翻车 OR 不好 OR 不行) min_faves:1'
    max_results: 50
    enabled: true
    min_faves: 1
  - id: Q4
    query_string: 'to:HunyuanAI min_faves:5'
    max_results: 50
    enabled: true
    min_faves: 5
    notes: May be 0 results until the official handle is confirmed; harmless.
  - id: Q5
    query_string: '("Hunyuan" OR "混元" OR "腾讯混元") (benchmark OR eval OR paper OR github OR code OR 开源) min_faves:3'
    max_results: 50
    enabled: true
    min_faves: 3
  - id: Q6
    query_string: '("Hunyuan" OR "混元" OR "腾讯混元") (amazing OR incredible OR "love it" OR best OR "mind blowing" OR 🤯 OR 卧槽 OR 太强了) min_faves:5'
    max_results: 50
    enabled: true
    min_faves: 5
