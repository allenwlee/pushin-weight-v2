    query_string: '(Sakana OR "Sakana AI" OR "Sakana Labs" OR "サカナAI") min_faves:5'
    max_results: 50
    enabled: true
    min_faves: 5
    notes: Brand-name Q1 fallback; switch to from:SakanaAILabs when operator confirms Sakana AI's official handle.
  - id: Q2
    query_string: '(Sakana OR "Sakana AI" OR "Sakana Labs" OR "サカナAI") (how OR 怎么 OR 教程 OR tutorial OR guide) min_faves:2'
