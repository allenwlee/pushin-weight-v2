# {AGENT_ATTRIBUTION}
# llama query library.
queries:
  - id: Q1
    query_string: '(Llama OR "Llama 3" OR "Llama 4" OR "Meta Llama" OR "Code Llama" OR "Muse Spark" OR "Llama 3.1") min_faves:5'
    max_results: 50
    enabled: true
    min_faves: 5
    notes: Brand-name fallback; switch to from:AIatMeta when operator confirms Meta's official handle.
  - id: Q2
    query_string: '(Llama OR "Llama 3" OR "Llama 4" OR "Meta Llama" OR "Code Llama" OR "Muse Spark" OR "Llama 3.1") (how OR 怎么 OR 教程 OR tutorial OR guide) min_faves:2'
    max_results: 50
    enabled: true
    min_faves: 2
  - id: Q3
    query_string: '(Llama OR "Llama 3" OR "Llama 4" OR "Meta Llama" OR "Code Llama" OR "Muse Spark" OR "Llama 3.1") (broken OR fails OR bad OR 翻车 OR 不好) min_faves:1'
    max_results: 50
    enabled: true
    min_faves: 1
  - id: Q4
    query_string: '(Llama OR "Llama 3" OR "Llama 4" OR "Meta Llama" OR "Code Llama" OR "Muse Spark" OR "Llama 3.1") min_faves:5'
    max_results: 50
    enabled: true
    min_faves: 5
    notes: Brand-name Q4 fallback; switch to to:AIatMeta when confirmed.
  - id: Q5
    query_string: '(Llama OR "Llama 3" OR "Llama 4" OR "Meta Llama" OR "Code Llama" OR "Muse Spark" OR "Llama 3.1") (benchmark OR eval OR paper OR github OR code OR 开源) min_faves:3'
    max_results: 50
    enabled: true
    min_faves: 3
  - id: Q6
    query_string: '(Llama OR "Llama 3" OR "Llama 4" OR "Meta Llama" OR "Code Llama" OR "Muse Spark" OR "Llama 3.1") (amazing OR incredible OR "love it" OR best OR "mind blowing" OR 🤯 OR 卧槽 OR 太强了) min_faves:5'
    max_results: 50
    enabled: true
    min_faves: 5
    notes: 5x min_faves to filter for unequivocally impressed (praise-only signal).
