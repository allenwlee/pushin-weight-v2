# {{AGENT_ATTRIBUTION}}
# Baidu ERNIE (文心一言) query library (v1: minimal Q1+Q2; Q3-Q6 land in v1.1).
# Brand-name Q1 fallback because the official Baidu_ERNIE handle is unconfirmed;
# the context disambiguator (LLM OR model OR Baidu OR 文心) filters out
# non-AI references to "ERNIE" (e.g. the Sesame Street character, the Bert variant).
queries:
  - id: Q1
    query_string: '("ERNIE" OR "文心一言") (LLM OR model OR Baidu OR 文心) -"Sesame Street" -Bert min_faves:5'
    expected_signal: release
    max_results: 50
    enabled: true
    min_faves: 5
    notes: Brand-name Q1 fallback; switch to from:Baidu_ERNIE if the official handle is confirmed.
  - id: Q2
    query_string: '("ERNIE" OR "文心一言") (how OR tutorial OR guide OR 教程 OR 怎么) min_faves:2'
    expected_signal: community_question
    max_results: 50
    enabled: true
    min_faves: 2
  - id: Q3
    query_string: '("ERNIE" OR "文心一言") (broken OR fails OR bad OR 翻车 OR 不好 OR 不行) min_faves:1'
    expected_signal: criticism
    max_results: 50
    enabled: true
    min_faves: 1
  - id: Q4
    query_string: 'to:Baidu_ERNIE min_faves:5'
    expected_signal: commenter_capture
    max_results: 50
    enabled: true
    min_faves: 5
    notes: May be 0 results until the official handle is confirmed; harmless.
  - id: Q5
    query_string: '("ERNIE" OR "文心一言") (benchmark OR eval OR paper OR github OR code OR 开源) min_faves:3'
    expected_signal: other
    max_results: 50
    enabled: true
    min_faves: 3
  - id: Q6
    query_string: '("ERNIE" OR "文心一言") (amazing OR incredible OR "love it" OR best OR "mind blowing" OR 🤯 OR 卧槽 OR 太强了) min_faves:5'
    expected_signal: praise
    max_results: 50
    enabled: true
    min_faves: 5
