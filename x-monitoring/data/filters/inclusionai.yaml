# InclusionAI relevance filter (v1.2).
# "Inclusion" is a generic word; current data is dominated by Tolkien
# fanfic (Inclusion as a Tolkien theme), Brat fanfic, and wrestling.
canonical_handles:
  - InclusionAI
  - inclusionai_lab
  - inclusion_ai

must_have_any:
  - inclusion
  - inclusionai
  - "inclusion ai"
  - inclusion-ai
  - ring-1
  - ring-1t
  - ling-mini
  - ling-flash
  - ming-lite

# Tokens associated with the noise we keep seeing.
must_have_none:
  - tolkien
  - middle-earth
  - middleearth
  - wwe
  - wrestling
  - fanfic
  - smackdown
  - rollins
  - reigns
  - undertaker
  - "aj styles"
  - "raw results"

notes: |
  Brand name is too generic — must have one of the model products
  (ring-1, ling, ming) OR the canonical handle.
