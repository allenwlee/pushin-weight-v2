# MiniMax AI relevance filter (v1.2).
# Hailuo AI is the consumer product (image/video gen). Celebrity fan
# posts (Kim K, Kylie Jenner using Hailuo) drift into Q5. Brand must
# include MiniMax or M3 explicitly.
canonical_handles:
  - MiniMaxAI
  - MiniMaxM3
  - MiniMax_Hailuo

must_have_any:
  - minimax
  - m3
  - m3.0
  - m2.7
  - m2.5
  - "MiniMax m"
  - minimax-agent
  - minimax-coding
  - minimax-work

cjk_tokens:
  - 海螺
  - 海螺ai
  - 智能

# "Hailuo 2.3" / "Hailuo-2.3" is an older Hailuo video product, NOT
# the current MiniMax model line. Celebrity fan content drifts in
# here. Soft-drop so user can promote real posts.
must_have_none:
  - hailuo-2.3
  - "hailuo 2.3"
  - "hailuo ai prompt"

notes: |
  The celebrity-Hailuo post (Purnell, Kylie, Kim K) is the main
  noise. Brand must be MiniMax or M2.7/M3.
